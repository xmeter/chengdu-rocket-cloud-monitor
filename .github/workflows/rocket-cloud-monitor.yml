name: Chengdu Rocket Cloud Monitor

on:
  schedule:
    # 每 6 小时自动巡检一次（北京时间 02:18 / 08:18 / 14:18 / 20:18）
    # 避开整点高峰，确保 GitHub Actions 准时调度且远低于公开 API 速率限制
    - cron: "18 */6 * * *"

  workflow_dispatch:
    inputs:
      simulate_test_email:
        description: "发送一封西昌曙光模拟火箭云测试邮件（用于首次验证邮箱配置，不污染去重记录）"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "仅巡检并在日志打印结果，不实际发送邮件"
        required: false
        default: false
        type: boolean
      min_probability:
        description: "触发通知的最低可见概率阈值"
        required: false
        default: "LOW"
        type: choice
        options:
          - LOW
          - MEDIUM
          - HIGH

permissions:
  contents: write

concurrency:
  group: chengdu-rocket-cloud-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Rocket Cloud Monitor
        id: monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          ROCKETLAUNCH_LIVE_API_KEY: ${{ secrets.ROCKETLAUNCH_LIVE_API_KEY }}
          MIN_PROBABILITY: ${{ inputs.min_probability || vars.MIN_PROBABILITY || 'LOW' }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD || '21' }}
        run: |
          ARGS=()
          if [ "${{ inputs.simulate_test_email }}" = "true" ]; then
            ARGS+=("--simulate")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          python3 monitor.py "${ARGS[@]}"

      - name: Persist deduplication state when new alert is sent
        if: steps.monitor.outputs.state_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): record notified rocket cloud launch [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
